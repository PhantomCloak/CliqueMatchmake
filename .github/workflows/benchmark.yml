name: Benchmark

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Player counts (comma-separated)'
        default: '1000'
        type: string
      iters:
        description: 'Repetitions per measurement'
        default: '3'
        type: string

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Benchmark
        shell: bash
        env:
          SIZES: ${{ inputs.sizes }}
          ITERS: ${{ inputs.iters }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          dotnet run -c Release --project benchmarks \
            -- "--sizes=$SIZES" "--iters=$ITERS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
