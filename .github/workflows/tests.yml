name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CliqueMatchmaker.slnx

      - name: Build
        run: dotnet build CliqueMatchmaker.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CliqueMatchmaker.slnx --configuration Release --no-build --verbosity normal
